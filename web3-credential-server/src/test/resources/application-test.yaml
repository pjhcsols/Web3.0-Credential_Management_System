spring:
  application:
    name: spring-gift-test
  datasource:
    url: jdbc:h2:mem:test;MODE=MYSQL;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: create
  h2:
    console:
      enabled: true
  main:
    allow-bean-definition-overriding: true

# AWS S3 Service Configuration
cloud:
  aws:
    s3BucketName: deep
    s3BucketUrl: deep
    credentialsAccessKey: deep
    credentialsSecretKey: deep
    region-static: ap-northeast-2
    stack:
      auto: false

# JWT Configuration
jwt:
  key: deep
  access-token-validity: 3600000
  refresh-token-validity: 86400000

# Kakao Configuration
kakao:
  client-id: deep
  redirect-uri: http://localhost:8080
